name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 21 is the FLOOR the code targets and 25 is what current stock installs give you. Both are
        # tested because the pair has broken before: an exact toolchain pin meant a machine holding
        # only JDK 25 could not build at all, and the build died before compiling a single file.
        # A single-JDK matrix cannot see that class of defect.
        include:
          - os: ubuntu-latest
            java: '21'
          - os: ubuntu-latest
            java: '25'
          - os: macos-latest
            java: '25'
        # Windows is supported and verified by hand, but the suite has not been run on a Windows
        # runner. It is left off rather than added untested — a red badge that everyone learns to
        # ignore is worse than an honest gap. See PLATFORMS.md.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew --no-daemon :core:test

      # The console banner is not the test count — read the XML, which is what the project's own
      # measurement rules require of any number that gets reported.
      - name: Summarize
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, re
          t = f = e = 0
          bad = []
          for x in glob.glob('core/build/test-results/test/*.xml'):
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"',
                            open(x).read(2000))
              if not m:
                  continue
              t += int(m.group(1)); f += int(m.group(3)); e += int(m.group(4))
              if int(m.group(3)) + int(m.group(4)):
                  bad.append(x.split('TEST-')[1][:-4])
          print(f"**{t} tests, {f} failures, {e} errors**\n")
          for b in bad:
              print(f"- FAILED `{b}`")
          PY

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.os }}-jdk${{ matrix.java }}
          path: core/build/reports/tests/test
          retention-days: 7
