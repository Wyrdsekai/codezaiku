name: Release

# Attest published release artifacts with Sigstore (keyless).
#
# This workflow deliberately BUILDS NOTHING. CodeZaiku's artifacts are built and
# validated on real hardware before the release is published — a platform claim
# that rests on CI rather than a run is exactly the kind this project refuses to
# make. The workflow fires after publication, downloads each asset, checks it
# against the release's own SHA256SUMS, attests the artifact hash via Sigstore
# keyless signing, and uploads the <asset>.sigstore.json bundle back to the
# release as a sibling.
#
# What the signature MEANS: "the CodeZaiku release workflow, running at this tag,
# blessed these exact bytes." It is an authenticity statement from the project's
# pinned CI identity — NOT SLSA build provenance, because this runner did not
# build the bytes. The predicate says so rather than letting the badge imply more
# than it earned.
#
# Verification, from any machine with the GitHub CLI:
#   gh attestation verify codezaiku-X.Y.Z.tar.gz --repo Wyrdsekai/codezaiku \
#     --predicate-type https://codezaiku.org/attestation/release/v1
#
# Uses ONLY GitHub-authored actions (actions/*), so a repository Actions policy
# can stay narrow.

on:
  release:
    types: [published]
  # Re-run for an already-published tag (e.g. the attest job failed):
  #   gh workflow run release.yml --ref v0.1.0
  # The ref MUST be the release tag — the Sigstore certificate identity embeds
  # it, so a run from any other ref signs under an identity verifiers reject.
  workflow_dispatch: {}

permissions:
  contents: write        # upload .sigstore.json bundles to the release
  id-token: write        # Sigstore keyless signing via GitHub OIDC; npm trusted publishing; the MCP Registry's OIDC login
  attestations: write    # actions/attest -> GitHub attestation store

jobs:
  attest:
    name: Attest ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false     # one unattested artifact must not hide the others
      matrix:
        include:
          # pattern: what gh downloads (a glob; the plain tarball's would match the platform builds too, since "x64"
          # ends in a digit); name: the one file the job attests, an exact expression
          - { artifact: tarball,     pattern: 'codezaiku-*.tar.gz',              name: 'codezaiku-[0-9.]+\.tar\.gz' }
          - { artifact: deb,         pattern: 'codezaiku_*_all.deb',             name: 'codezaiku_[0-9.]+_all\.deb' }
          # the builds with their own Java runtime, made by scripts/release-build.sh with the rest (from 0.3.2; a re-run
          # of this workflow on an older tag shows these five red, which is the truth about that release)
          - { artifact: linux-x64,   pattern: 'codezaiku-*-linux-x64.tar.gz',    name: 'codezaiku-[0-9.]+-linux-x64\.tar\.gz' }
          - { artifact: linux-arm64, pattern: 'codezaiku-*-linux-arm64.tar.gz',  name: 'codezaiku-[0-9.]+-linux-arm64\.tar\.gz' }
          - { artifact: macos-x64,   pattern: 'codezaiku-*-macos-x64.tar.gz',    name: 'codezaiku-[0-9.]+-macos-x64\.tar\.gz' }
          - { artifact: macos-arm64, pattern: 'codezaiku-*-macos-arm64.tar.gz',  name: 'codezaiku-[0-9.]+-macos-arm64\.tar\.gz' }
          - { artifact: windows-x64, pattern: 'codezaiku-*-windows-x64.tar.gz',  name: 'codezaiku-[0-9.]+-windows-x64\.tar\.gz' }
    steps:
      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            echo "workflow_dispatch must run on a tag ref (got $GITHUB_REF)." >&2
            echo "Use: gh workflow run release.yml --ref vX.Y.Z" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Attesting release $TAG"

      - name: Download asset + checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '${{ matrix.pattern }}' \
            --dir assets
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'SHA256SUMS*' \
            --dir assets
          ls -lh assets

      - name: Verify checksum before attesting
        id: asset
        run: |
          cd assets
          FILE=$(find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\n' | grep -E '^${{ matrix.name }}$' || true)
          COUNT=$(printf '%s\n' "$FILE" | grep -c .)
          if [ "$COUNT" -ne 1 ]; then
            echo "Expected exactly one asset named like '${{ matrix.name }}', got $COUNT:" >&2
            printf '%s\n' "$FILE" >&2
            exit 1
          fi
          EXPECTED=$(awk -v f="$FILE" '$2 == f { print $1 }' SHA256SUMS*)
          if [ -z "$EXPECTED" ]; then
            echo "$FILE is not listed in the release's SHA256SUMS — refusing to attest." >&2
            exit 1
          fi
          ACTUAL=$(sha256sum "$FILE" | awk '{ print $1 }')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Checksum mismatch for $FILE (expected $EXPECTED, got $ACTUAL) — refusing to attest." >&2
            exit 1
          fi
          echo "Checksum OK: $ACTUAL  $FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Attest
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: assets/${{ steps.asset.outputs.file }}
          predicate-type: 'https://codezaiku.org/attestation/release/v1'
          predicate: >-
            {"tag": "${{ steps.tag.outputs.tag }}",
             "checksumSource": "release SHA256SUMS, verified pre-attestation",
             "builder": "built and validated on real hardware before publish, not by this runner",
             "attestedBy": "post-publish attestation via .github/workflows/release.yml"}

      - name: Upload bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUNDLE="${{ steps.attest.outputs.bundle-path }}"
          if [ -z "$BUNDLE" ] || [ ! -f "$BUNDLE" ]; then
            echo "actions/attest produced no bundle" >&2
            exit 1
          fi
          # Convention: <artifact>.sigstore.json is the sibling bundle of <artifact>.
          OUT="assets/${{ steps.asset.outputs.file }}.sigstore.json"
          cp "$BUNDLE" "$OUT"
          # GitHub's upload endpoint answers 500 now and then. One failed upload fails this job, and the launcher and
          # registry jobs that wait on it are then skipped (ResearchZosho 0.4.5 lost all three that way).
          for i in 1 2 3 4 5; do
            if gh release upload "${{ steps.tag.outputs.tag }}" "$OUT" --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "Uploaded $(basename "$OUT")"
              exit 0
            fi
            echo "upload failed (try $i of 5); waiting 20 s" >&2
            sleep 20
          done
          exit 1

  # The npm launcher (npm/): the package version is the release's; trusted publishing signs it with this workflow's
  # identity (no token; set up once on npmjs.com for the package, after its first publish by hand — RELEASING.md).
  # A version already on npm — the first one, published by hand — is left alone. Still only GitHub-authored actions.
  launcher:
    name: Launcher on npm
    needs: attest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: npm 11.5+ (trusted publishing)
        run: npm install -g npm@latest && npm --version
      - name: The launcher names this release
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          V=$(node -p "require('./npm/package.json').version")
          [ "${V%%-*}" = "${TAG#v}" ] || { echo "npm/package.json says $V, the release is ${TAG#v}" >&2; exit 1; }   # 0.1.6-1 starts 0.1.6
          cd npm && npm test
      - name: Publish
        working-directory: npm
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@wyrdsekai/codezaiku-mcp@$V" version >/dev/null 2>&1; then echo "already on npm: $V"; exit 0; fi
          npm publish --access public --tag latest   # required for a version with a suffix (0.1.6-1); harmless otherwise

  # The MCP Registry entry (server.json): the npm launcher it names must exist first.
  registry:
    name: MCP Registry
    needs: launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
      - name: mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help | head -1
      - name: server.json names this release
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          V=$(jq -r .version server.json)
          [ "$V" = "${TAG#v}" ] || { echo "server.json says $V, the release is ${TAG#v}" >&2; exit 1; }
          ./mcp-publisher validate
      - name: Publish
        run: |
          # npm can take minutes to show a new version to the registry, so publishing is retried for up to fifteen.
          # The registry login lasts only a few minutes: log in again before every attempt, or the later ones are refused.
          for i in $(seq 1 30); do ./mcp-publisher login github-oidc && ./mcp-publisher publish && exit 0; echo "retry $i: npm may still be propagating"; sleep 30; done
          exit 1

